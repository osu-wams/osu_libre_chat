version: "1.2.1"

endpoints:
  azureOpenAI:
    # Additional azureOpenAI settings can go here if needed
    groups:
      - group: "openai"
        apiKey: "openai-api-key"                # Bicep will replace
        instanceName: "openai-instance-name" # Bicep will replace
        version: "2025-01-01-preview"        # default API version
        forcePrompt: false
        assistants: true
        models:
          model-router:
            deploymentName: "openai-model-router-deployment-name"
            version: "2025-01-01-preview"    # match Azure, 2025-11-18
          gpt-5.2:
            deploymentName: "openai-gpt5.2-deployment-name"
            version: "2025-04-01-preview"    # match Azure, 2025-12-11
# librechat.yaml (or your main config)
speech:
  tts:
    azureOpenAI:
      instanceName: "${OPENAI_INSTANCE_NAME}"
      apiKey: "${AZURE_TTS_API_KEY}"
      deploymentName: "${GPT4O_MINI_TTS_DEPLOYMENT_NAME}"
      apiVersion: "${AZURE_OPENAI_API_VERSION}"
      model: "tts-1"
      voices: ["alloy", "echo", "fable", "onyx", "nova", "shimmer"]

  stt:
    azureOpenAI:
      instanceName: "${OPENAI_INSTANCE_NAME}"
      apiKey: "${AZURE_STT_API_KEY}"
      deploymentName: "${GPT4O_MINI_TRANSCRIBE_DEPLOYMENT_NAME}"
      apiVersion: "${AZURE_OPENAI_API_VERSION}"

  speechTab:
    conversationMode: false
    advancedMode: false
    speechToText:
      engineSTT: "azureOpenAI"
      autoTranscribeAudio: true
      decibelValue: -45
    textToSpeech:
      engineTTS: "azureOpenAI"
      voice: "nova"
      automaticPlayback: false
      playbackRate: 1.0
      cacheTTS: true
