endpoints:
  azureOpenAI:
    # Additional azureOpenAI settings can go here if needed
    groups:
      - group: "openai"
        apiKey: "openai-key"
        instanceName: "openai-instance-name"
        forcePrompt: false
        assistants: true
        models:
          gpt-5:
            deploymentName: gpt-5
            version: "2025-08-07"