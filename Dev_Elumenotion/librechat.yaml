endpoints:
  azureOpenAI:
    # Other azureOpenAI settings can go here if needed (...)
    groups:
      - group: "openai"
        apiKey: "openai-key"
        instanceName: "openai-instance-name"
        forcePrompt: false
        assistants: true
        models:
          gpt-5.2-codex:
            deploymentName: gpt-5.2-codex
            version: "2026-01-14"
          gpt-5.2:
            deploymentName: gpt-5.2
            version: "2025-12-11"